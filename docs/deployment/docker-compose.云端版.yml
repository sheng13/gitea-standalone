# 公司云端部署版 docker-compose.yml （Gitea + PostgreSQL）
# 用途：上公司云时，IT 拿到此档 + `docker compose up -d` 即可启动
# 说明：PostgreSQL 解决 SQLite 并发上限；数据卷确保重启/升级不丢资料
# 改法：把 DOMAIN / ROOT_URL 换成公司网址（如 git.公司网域.com），并改用公司 CA 证书做 HTTPS

services:
  db:
    image: postgres:16-alpine
    container_name: gitea-db
    restart: always
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=gitea
    volumes:
      - gitea-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea"]
      interval: 10s
      timeout: 5s
      retries: 5

  gitea:
    image: gitea/gitea:1.27.0
    container_name: gitea
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # 以下三项部署时改成公司网址
      - GITEA__server__DOMAIN=git.公司网域.com
      - GITEA__server__ROOT_URL=https://git.公司网域.com/
      - GITEA__server__SSH_PORT=2222
      # 数据库接 PostgreSQL（替代 demo 的 SQLite）
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # 接公司统一账号（部署时填 LDAP/SSO 资讯）
      # - GITEA__service__DISABLE_REGISTRATION=true
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  gitea-db-data:
  gitea-data:
